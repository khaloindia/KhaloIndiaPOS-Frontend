<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khalo India - Menu</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; }
        .header { background-color: #ff5722; color: white; text-align: center; padding: 20px; font-size: 24px; font-weight: bold; }
        .menu-container { padding: 15px; }
        .menu-item { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .item-details h3 { margin: 0 0 5px 0; color: #333; font-size: 18px; }
        .item-details p { margin: 0; color: #777; font-size: 14px; }
        .price { font-weight: bold; color: #ff5722; font-size: 18px; }
        .add-btn { background-color: #ff5722; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .cart-footer { position: fixed; bottom: 0; width: 100%; background: #333; color: white; padding: 15px; text-align: center; box-sizing: border-box; display: none; }
    </style>
</head>
<body>

    <div class="header">
        KHALO INDIA
    </div>

    <div class="menu-container">
        <!-- Item 1 -->
        <div class="menu-item">
            <div class="item-details">
                <h3>Special Chicken Biryani</h3>
                <p>Authentic dum biryani with raita</p>
                <span class="price">₹199</span>
            </div>
            <button class="add-btn" onclick="addToCart()">Add</button>
        </div>

        <!-- Item 2 -->
        <div class="menu-item">
            <div class="item-details">
                <h3>Desi Cold Coffee</h3>
                <p>Thick cold coffee with chocolate drops</p>
                <span class="price">₹89</span>
            </div>
            <button class="add-btn" onclick="addToCart()">Add</button>
        </div>
    </div>

    <div class="cart-footer" id="cartFooter">
        <span id="cartText">1 Item Added</span> | 
        <button style="background:#ff5722; color:white; border:none; padding:5px 10px; border-radius:3px;" onclick="placeOrder()">Place Order</button>
    </div>

    <script>
                let cartCount = 0;
        
        function addToCart() {
            cartCount++;
            document.getElementById('cartFooter').style.display = 'block';
            document.getElementById('cartText').innerText = cartCount + " Item(s) Added";
        }

        async function placeOrder() {
            // নিচে আপনার Render-এর লাইভ লিংকটা বসাবেন
            const backendUrl = "https://khaloindiapos-backend-1.onrender.com/place-order"; 
            
            try {
                let response = await fetch(backendUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        table: "Table 1", 
                        items: cartCount,
                        total_amount: cartCount * 199 
                    })
                });
                
                let result = await response.json();
                alert("Order sent to Kitchen successfully!");
                
                cartCount = 0;
                document.getElementById('cartFooter').style.display = 'none';
            } catch (error) {
                alert("Error connecting to server! Check connection.");
            }
        }
        
    </script>

</body>
</html>
