<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashier Dashboard - Khalo India</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; margin: 0; padding: 0; }
        .header { background-color: #212529; color: white; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; }
        .container { padding: 20px; max-width: 800px; margin: auto; }
        .order-card { background: white; border-left: 5px solid #ff5722; padding: 15px; margin-bottom: 15px; border-radius: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .order-card h3 { margin: 0 0 10px 0; color: #ff5722; }
        .order-details { margin: 5px 0; color: #495057; font-size: 16px; }
        .status-badge { background-color: #ffc107; color: black; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; display: inline-block; margin-top: 10px; }
        .btn-accept { background-color: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 3px; cursor: pointer; float: right; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        Khalo India - Live Cashier Panel
    </div>

    <div class="container" id="ordersContainer">
        <h2>Live Orders</h2>
        <p id="waitingMessage" style="color: #6c757d; font-style: italic;">Waiting for new orders from customers...</p>
        <!-- New orders will automatically pop up here -->
    </div>

    <script>
        // WebSockets connect korar jonno 'wss://' use korte hoy (https er bodole)
        const wsUrl = "wss://khaloindiapos-backend-1.onrender.com/ws/cashier";
        
        let ws = new WebSocket(wsUrl);

        ws.onopen = function() {
            console.log("Connected to Khalo India Server!");
        };

        ws.onmessage = function(event) {
            // Remove the waiting message when an order comes
            document.getElementById('waitingMessage').style.display = 'none';

            // Get the order data
            let orderText = event.data;
            
            // Create a new visual card for the order
            let orderDiv = document.createElement("div");
            orderDiv.className = "order-card";
            
            orderDiv.innerHTML = `
                <h3>New Order Received!</h3>
                <div class="order-details">${orderText}</div>
                <span class="status-badge">Pending</span>
                <button class="btn-accept" onclick="acceptOrder(this)">Accept</button>
            `;
            
            // Push the new order to the top of the list
            let container = document.getElementById('ordersContainer');
            container.insertBefore(orderDiv, container.children[2]);
        };

        ws.onclose = function() {
            alert("Server connection lost! Please refresh the page.");
        };

        function acceptOrder(button) {
            button.innerText = 'Cooking...';
            button.style.backgroundColor = '#17a2b8';
            button.previousElementSibling.innerText = 'Accepted';
            button.previousElementSibling.style.backgroundColor = '#28a745';
            button.previousElementSibling.style.color = 'white';
        }
    </script>
</body>
</html>
